<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Enhanced AI Responses</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a2e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .test-section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        input {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 16px;
        }
        
        input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        button {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .response-box {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            min-height: 200px;
        }
        
        .response-box h2 {
            color: #60a5fa;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        
        .response-box h3 {
            color: #a78bfa;
            margin-top: 15px;
            margin-bottom: 8px;
        }
        
        .response-box ul {
            margin-left: 20px;
            margin-top: 10px;
        }
        
        .response-box li {
            margin-bottom: 8px;
            line-height: 1.6;
        }
        
        .response-box a {
            color: #60a5fa;
            text-decoration: none;
        }
        
        .response-box a:hover {
            text-decoration: underline;
        }
        
        .response-box p {
            line-height: 1.8;
            margin-bottom: 15px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #9ca3af;
        }
        
        .quick-tests {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .quick-test-btn {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .quick-test-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Test Enhanced AI Responses</h1>
        
        <div class="test-section">
            <h2 style="margin-bottom: 20px;">Quick Tests</h2>
            <div class="quick-tests">
                <button class="quick-test-btn" onclick="testMessage('Hello')">👋 Hello</button>
                <button class="quick-test-btn" onclick="testMessage('What is AI?')">🤖 What is AI?</button>
                <button class="quick-test-btn" onclick="testMessage('I feel sad')">😢 I feel sad</button>
                <button class="quick-test-btn" onclick="testMessage('I need help')">🆘 I need help</button>
                <button class="quick-test-btn" onclick="testMessage('Thank you')">🙏 Thank you</button>
            </div>
        </div>
        
        <div class="test-section">
            <div class="input-group">
                <input 
                    type="text" 
                    id="messageInput" 
                    placeholder="Type your message here..."
                    onkeypress="if(event.key === 'Enter') sendMessage()"
                >
            </div>
            <button onclick="sendMessage()" id="sendBtn">Send Message</button>
            
            <div id="response" class="response-box" style="display: none;">
                <div id="responseContent"></div>
            </div>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            const responseBox = document.getElementById('response');
            const responseContent = document.getElementById('responseContent');
            const sendBtn = document.getElementById('sendBtn');
            
            // Show loading
            responseBox.style.display = 'block';
            responseContent.innerHTML = '<div class="loading">🤔 Thinking...</div>';
            sendBtn.disabled = true;
            
            try {
                const response = await fetch('http://localhost:7860/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        user_id: 'test_user'
                    })
                });
                
                const data = await response.json();
                
                // Convert markdown to HTML
                const htmlContent = marked.parse(data.response);
                responseContent.innerHTML = htmlContent;
                
            } catch (error) {
                responseContent.innerHTML = `<p style="color: #ef4444;">Error: ${error.message}</p>`;
            } finally {
                sendBtn.disabled = false;
            }
        }
        
        function testMessage(message) {
            document.getElementById('messageInput').value = message;
            sendMessage();
        }
    </script>
</body>
</html>
